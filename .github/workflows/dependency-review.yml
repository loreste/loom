name: dependency-review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dependency review is a required security gate. Enable the repository
      # dependency graph before merging changes that add or update packages.
      - uses: actions/dependency-review-action@v4
