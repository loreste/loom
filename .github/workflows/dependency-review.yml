name: dependency-review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Dependency review is a required security gate. Enable the repository
      # dependency graph before merging changes that add or update packages.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
