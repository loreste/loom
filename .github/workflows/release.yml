name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          LOOM_VERSION: ${{ github.ref_name }}
          LOOM_COMMIT: ${{ github.sha }}
          LOOM_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: loom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/loom-*

  sbom:
    name: release-sbom
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SBOM output
        run: mkdir -p dist
      - uses: anchore/sbom-action@v0.20.5
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/loom-${{ github.ref_name }}-sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: loom-release-sbom
          path: dist/loom-${{ github.ref_name }}-sbom.cdx.json

  publish:
    needs: [binaries, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: loom-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/loom-*
