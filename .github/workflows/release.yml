name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact release tag to publish"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

env:
  RELEASE_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  release-gate:
    name: release-integrity-gate
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - name: Verify release tag and required workflows
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag_sha=$(git rev-list -n 1 "$RELEASE_REF")
          test -n "$tag_sha"
          git show-ref --verify --quiet "refs/tags/$RELEASE_REF"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$tag_sha" = "$GITHUB_SHA"
          fi
          echo "target_sha=$tag_sha" >>"$GITHUB_OUTPUT"
          for attempt in $(seq 1 90); do
            all_ready=true
            for workflow in ci security dependency-review container-scan; do
              if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$tag_sha&per_page=100" \
                --jq ".workflow_runs[] | select(.name == \"$workflow\" and .head_sha == \"$tag_sha\" and .conclusion == \"success\") | .id" | grep -q .; then
                all_ready=false
                break
              fi
            done
            if [ "$all_ready" = true ]; then
              exit 0
            fi
            sleep 10
          done
          echo "required CI workflows did not all pass for $tag_sha" >&2
          exit 1

  binaries:
    needs: release-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          LOOM_VERSION: ${{ env.RELEASE_REF }}
          LOOM_COMMIT: ${{ needs.release-gate.outputs.target_sha }}
          LOOM_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/loom-*

  sbom:
    name: release-sbom
    needs: [release-gate, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare SBOM output
        run: mkdir -p dist
      - uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/loom-${{ env.RELEASE_REF }}-sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loom-release-sbom
          path: dist/loom-${{ env.RELEASE_REF }}-sbom.cdx.json

  checksums:
    name: release-checksums
    needs: [release-gate, binaries, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: loom-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: sh ./scripts/generate-checksums.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loom-release-checksums
          path: dist/SHA256SUMS

  signatures:
    name: release-signatures
    needs: [release-gate, binaries, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: loom-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign release binaries with keyless Cosign
        env:
          COSIGN_YES: "true"
        run: |
          set -eu
          for asset in dist/loom-*; do
            [ -f "$asset" ] || continue
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loom-release-signatures
          path: dist/*.sigstore.json

  provenance:
    name: release-provenance
    needs: [release-gate, binaries, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: loom-*
          path: dist
          merge-multiple: true
      - name: Attest release subjects
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/loom-*

  publish:
    needs: [release-gate, binaries, sbom, checksums, signatures, provenance]
    runs-on: ubuntu-latest
    steps:
      # Checkout must precede download-artifact: the verification script lives
      # in the repository, and checking out afterwards would clear dist.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: loom-*
          merge-multiple: true
      - name: Verify release artifacts before publication
        run: sh ./scripts/verify-release-artifacts.sh dist
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ env.RELEASE_REF }}
          files: |
            dist/loom-*
            dist/SHA256SUMS
