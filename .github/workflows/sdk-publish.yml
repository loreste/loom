name: sdk-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  RELEASE_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  release-gate:
    name: sdk-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - name: Require exact-tag CI and security success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(git rev-list -n 1 "$RELEASE_REF")
          test "$sha" = "$(git rev-parse HEAD)"
          for workflow in ci security dependency-review container-scan; do
            ready=false
            for attempt in $(seq 1 90); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
                --jq ".workflow_runs[] | select(.name == \"$workflow\" and .head_sha == \"$sha\" and .conclusion == \"success\") | .id" | grep -q .; then
                ready=true
                break
              fi
              sleep 10
            done
            test "$ready" = true
          done

  version:
    name: sdk-version-alignment
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Verify package versions
        run: sh scripts/check-sdk-versions.sh "$RELEASE_REF"

  python:
    name: publish-python
    needs: version
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        working-directory: sdk/python
        run: python -m pip install --upgrade build && python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: sdk/python/dist/

  node:
    name: publish-node
    needs: version
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org
      - name: Build and publish package with provenance
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --no-package-lock
          npm run build
          npm publish --provenance --access public

  rust:
    name: publish-rust
    needs: version
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@275b31c2bd0ae2dc5fc5b03747ab8c88d6e3b1c6
        id: auth
      - name: Publish crate with OIDC credentials
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --allow-dirty

  registry-install:
    name: Verify public registry installations
    needs: [python, node, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Resolve published version
        id: version
        run: echo "value=${RELEASE_REF#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Install Go module from public proxy
        env:
          SDK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          go mod init loom-registry-consumer
          GOPROXY=https://proxy.golang.org go get "github.com/loreste/loom@v${SDK_VERSION}"
          test "$(GOPROXY=https://proxy.golang.org go list -m -f '{{.Version}}' github.com/loreste/loom)" = "v${SDK_VERSION}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Python SDK from PyPI
        env:
          SDK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          for attempt in $(seq 1 12); do
            if python -m pip install --no-cache-dir "loom-sdk==${SDK_VERSION}"; then
              python -c 'import loom; print(loom.__file__)'
              break
            fi
            [ "$attempt" -eq 12 ] && exit 1
            sleep 10
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
      - name: Install TypeScript SDK from npm
        env:
          SDK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          for attempt in $(seq 1 12); do
            if npm install --prefix "$tmp" "@loreste/loom-sdk@${SDK_VERSION}"; then
              cd "$tmp"
              node --input-type=module -e 'import "@loreste/loom-sdk"'
              break
            fi
            [ "$attempt" -eq 12 ] && exit 1
            sleep 10
          done
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - name: Install Rust SDK from crates.io
        env:
          SDK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cargo new --quiet "$tmp/consumer"
          cd "$tmp/consumer"
          for attempt in $(seq 1 12); do
            if cargo add "loom-sdk@${SDK_VERSION}" && cargo check; then
              break
            fi
            [ "$attempt" -eq 12 ] && exit 1
            sleep 10
          done
