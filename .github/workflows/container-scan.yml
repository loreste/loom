name: container-scan

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "app/**"
      - "runtime/**"
      - "store/**"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "app/**"
      - "runtime/**"
      - "store/**"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build image
        run: docker build --tag loom-security:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: loom-security:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
