name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: go-test-race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Fuzz runtime (short)
        run: go test -fuzz=FuzzExecute -fuzztime=15s ./runtime/

      - name: Build
        run: go build ./...

  binaries:
    name: cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        run: |
          chmod +x scripts/build-release.sh
          VERSION="${GITHUB_SHA::7}" ./scripts/build-release.sh
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: loom-binaries-${{ github.sha }}
          path: |
            dist/loom-*
            dist/SHA256SUMS
          retention-days: 14

  postgres:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration
        env:
          LOOM_DATABASE_URL: postgres://loom:loom@127.0.0.1:5432/loom?sslmode=disable
        run: go test ./store/postgres/ ./bootstrap/ -run Postgres -count=1
