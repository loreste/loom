name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: go-test-race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Fuzz runtime (short)
        run: go test -fuzz=FuzzExecute -fuzztime=15s ./runtime/

      - name: Build
        run: go build ./...

      - name: SDK version alignment
        run: sh scripts/check-sdk-versions.sh

      - name: Release manifest and docs accuracy
        run: sh scripts/check-release-manifest.sh

  postgres:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration
        env:
          LOOM_DATABASE_URL: postgres://loom:loom@127.0.0.1:5432/loom?sslmode=disable
        run: |
          go test ./store/postgres/ -run Postgres -count=1
          go test ./bootstrap/ -run Postgres -count=1

  redis:
    name: redis-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Redis integration
        env:
          LOOM_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test ./quotas/ -run RedisLimiterIntegration -count=1

  python-sdk:
    name: python-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install package and development checks
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Type check
        run: python -m mypy loom
      - name: Build and validate package
        run: python -m build && python -m pip install --force-reinstall dist/*.whl

  typescript-sdk:
    name: typescript-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package.json
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build
        run: npm run build
      - name: Lint and type check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Validate package
        run: npm pack --dry-run

  rust-sdk:
    name: rust-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Validate crate package
        run: cargo package --allow-dirty

  sdk-contract:
    name: sdk-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
      - name: Install SDK dependencies
        run: |
          python -m pip install -e sdk/python
          cd sdk/typescript && npm install --no-package-lock
      - name: Start contract server
        env:
          LOOM_CONTRACT_ADDR: 127.0.0.1:18080
          LOOM_CONTRACT_BOUNDARY: sdk-test
          LOOM_CONTRACT_OPERATION: sdk.contract
          LOOM_CONTRACT_PRINCIPAL: sdk-contract
          LOOM_CONTRACT_TOKEN: ci-contract-token
        run: |
          go run ./scripts/sdk-contract-server > /tmp/loom-sdk-contract.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/healthz && break
            sleep 1
          done
      - name: Run Python contract
        env:
          LOOM_CONTRACT_URL: http://127.0.0.1:18080
          LOOM_CONTRACT_BOUNDARY: sdk-test
          LOOM_CONTRACT_OPERATION: sdk.contract
          LOOM_CONTRACT_TOKEN: ci-contract-token
        run: python -m unittest discover -s sdk/python/tests -v
      - name: Run TypeScript contract
        env:
          LOOM_CONTRACT_URL: http://127.0.0.1:18080
          LOOM_CONTRACT_BOUNDARY: sdk-test
          LOOM_CONTRACT_OPERATION: sdk.contract
          LOOM_CONTRACT_TOKEN: ci-contract-token
        run: cd sdk/typescript && npm run build && npm test
      - name: Run Rust contract
        env:
          LOOM_CONTRACT_URL: http://127.0.0.1:18080
          LOOM_CONTRACT_BOUNDARY: sdk-test
          LOOM_CONTRACT_OPERATION: sdk.contract
          LOOM_CONTRACT_TOKEN: ci-contract-token
        run: cargo test --manifest-path sdk/rust/Cargo.toml
  helm:
    name: helm-chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.17.3
      - name: Lint chart with external-secret and verifier references
        run: |
          helm lint deploy/helm/loom \
            --set secrets.existingSecret=loom-ci \
            --set recoveryWorker.verifierURL=https://provider.invalid/recovery/verify
      - name: Render templates (recovery + durable webhook worker)
        run: |
          helm template loom deploy/helm/loom \
            --set secrets.existingSecret=loom-runtime \
            --set recoveryWorker.verifierURL=https://provider.example/recovery/verify \
            --set loom.webhook.url=https://hooks.example.com/loom \
            --set loom.webhook.allowHosts=hooks.example.com \
            --set-json 'networkPolicy.egress.shared=[{"to":[{"ipBlock":{"cidr":"10.0.0.0/8"}}],"ports":[{"protocol":"TCP","port":5432}]}]' \
            --set-json 'networkPolicy.egress.recovery=[{"to":[{"ipBlock":{"cidr":"203.0.113.10/32"}}],"ports":[{"protocol":"TCP","port":443}]}]' \
            --set-json 'networkPolicy.egress.webhook=[{"to":[{"ipBlock":{"cidr":"203.0.113.20/32"}}],"ports":[{"protocol":"TCP","port":443}]}]' \
            > /tmp/loom-helm.yaml
          grep -q 'app.kubernetes.io/component: webhook-worker' /tmp/loom-helm.yaml
          grep -q 'args: \["webhook-worker"\]' /tmp/loom-helm.yaml
          grep -q 'LOOM_WEBHOOK_DURABLE' /tmp/loom-helm.yaml
          grep -q 'app.kubernetes.io/component: recovery-worker' /tmp/loom-helm.yaml
          # API must not run an in-process webhook worker by default.
          ! grep -A2 'name: LOOM_WEBHOOK_RUN_WORKER' /tmp/loom-helm.yaml | grep -q 'value: "true"'
          # Component NetworkPolicies and DNS defaults.
          grep -q 'name: loom-loom-api' /tmp/loom-helm.yaml
          grep -q 'name: loom-loom-recovery' /tmp/loom-helm.yaml
          grep -q 'name: loom-loom-webhook' /tmp/loom-helm.yaml
          grep -q 'k8s-app: kube-dns' /tmp/loom-helm.yaml
          grep -q 'app.kubernetes.io/component: api' /tmp/loom-helm.yaml
          # Secure path must not emit unrestricted egress on the API policy.
          python3 -c "
          from pathlib import Path
          text = Path('/tmp/loom-helm.yaml').read_text()
          assert '- {}' not in text.split('name: loom-loom-api', 1)[1].split('---', 1)[0], 'api policy has open egress'
          print('networkpolicy default-deny checks passed')
          "
          # Break-glass allowAll still works.
          helm template loom deploy/helm/loom \
            --set secrets.existingSecret=loom-runtime \
            --set recoveryWorker.verifierURL=https://provider.example/recovery/verify \
            --set networkPolicy.egress.allowAll=true \
            | grep -A5 'egress:' | grep -q '{}'
