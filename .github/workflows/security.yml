name: security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan Go dependencies
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... 2>&1 | tee /tmp/govulncheck.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::warning::govulncheck reported findings or could not complete; inspect the uploaded log"
          fi
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-log
          path: /tmp/govulncheck.log

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan Go source
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.8 -exclude-dir=adapters/grpc/gen ./...

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0.20.5
        with:
          path: .
          format: cyclonedx-json
          output-file: loom-sbom.cdx.json
          upload-artifact: true
