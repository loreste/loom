services:
  # Optional Loom server (dev). Prefer explicit production env for real deploys.
  loom:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      LOOM_ENV: development
      LOOM_ADDR: ":8080"
      LOOM_GRPC_ADDR: ":9090"
      # Point at compose postgres when using durable mode:
      # LOOM_DATABASE_URL: postgres://loom:loom@postgres:5432/loom?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve", "--addr=:8080", "--grpc-addr=:9090"]
    profiles: ["loom"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - loom_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - loom_redis:/data

volumes:
  loom_pg:
  loom_redis:
