image:
  repository: ghcr.io/loreste/loom
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

api:
  replicas: 2
  service:
    type: ClusterIP
    port: 8080
  resources: {}

recoveryWorker:
  enabled: true
  replicas: 1
  verifierURL: ""
  resources: {}
  poll: 5s
  lease: 5m
  backoffBase: 1s
  backoffMax: 5m
  maxAttempts: "8"

# Separate durable webhook delivery worker. Enabled only when loom.webhook.url
# is set; the API enqueues to loom_webhook_outbox and does not deliver inline.
webhookWorker:
  enabled: true
  replicas: 1
  resources: {}
  poll: 2s
  lease: 30s
  backoffBase: 1s
  backoffMax: 5m
  maxAttempts: "8"

secrets:
  existingSecret: ""
  databaseURLKey: database-url
  redisURLKey: redis-url
  jwtSecretKey: jwt-secret
  jwtIssuerKey: jwt-issuer
  jwtAudienceKey: jwt-audience
  recoveryVerifierTokenKey: recovery-verifier-token
  webhookSecretKey: webhook-secret

loom:
  tenantClaim: tenant_id
  policyPath: ""
  policySyncInterval: 5s
  trustedTLSProxy: true
  httpRateLimitPerMinute: "0"
  webhook:
    # Optional durable audit webhook. Leave url empty to disable.
    # When set, the API enqueues only; webhookWorker delivers.
    url: ""
    keyId: ""
    allowHosts: ""
    failClosed: false
    timeout: 5s
    durable: true
    runWorkerInAPI: false

serviceAccount:
  create: true
  name: ""

networkPolicy:
  enabled: true
  # Empty matchLabels means "from any namespace" for API ingress (typical
  # behind an ingress controller). Tighten to the ingress namespace in production.
  allowedIngressNamespaceSelector: {}
  egress:
    # Secure default: deny all egress except DNS + explicit peers below.
    # Set allowAll: true only as temporary break-glass (not for production).
    allowAll: false
    dns:
      enabled: true
      # null => defaults: namespace kubernetes.io/metadata.name=kube-system,
      # pod k8s-app=kube-dns. Override both for non-standard clusters.
      namespaceSelector: null
      podSelector: null
    # Applied to API, recovery, and webhook workers (Postgres + Redis).
    shared: []
    # API-only peers (e.g. OIDC issuer CIDR or service).
    api: []
    # Recovery worker peers (provider verifier endpoint).
    recovery: []
    # Webhook worker peers (webhook destination CIDR or service).
    webhook: []
    # Example (copy into shared / api / recovery / webhook as needed):
    # shared:
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes: data
    #         podSelector:
    #           matchLabels:
    #             app: postgres
    #     ports:
    #       - protocol: TCP
    #         port: 5432
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes: data
    #         podSelector:
    #           matchLabels:
    #             app: redis
    #     ports:
    #       - protocol: TCP
    #         port: 6379
    # recovery:
    #   - to:
    #       - ipBlock:
    #           cidr: 203.0.113.10/32
    #     ports:
    #       - protocol: TCP
    #         port: 443
    # webhook:
    #   - to:
    #       - ipBlock:
    #           cidr: 203.0.113.20/32
    #     ports:
    #       - protocol: TCP
    #         port: 443

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

migration:
  enabled: true
