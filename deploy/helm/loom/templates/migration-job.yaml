{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "loom.fullname" . }}-migration
  labels:
    {{- include "loom.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "loom.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "loom.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: {{ include "loom.image" . }}
          args: ["migrate"]
          env:
            - name: LOOM_ENV
              value: production
            - name: LOOM_REQUIRE_DURABLE
              value: "true"
            - name: LOOM_DISABLE_DEMO_PRINCIPALS
              value: "true"
            - name: LOOM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.databaseURLKey }}
            - name: LOOM_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.redisURLKey }}
            - name: LOOM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.jwtSecretKey }}
            - name: LOOM_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.jwtIssuerKey }}
            - name: LOOM_JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.jwtAudienceKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
