{{- if and .Values.loom.webhook.url .Values.webhookWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loom.fullname" . }}-webhook
  labels:
    {{- include "loom.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-worker
spec:
  replicas: {{ .Values.webhookWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "loom.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: webhook-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "loom.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: webhook-worker
    spec:
      serviceAccountName: {{ include "loom.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-worker
          image: {{ include "loom.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["webhook-worker"]
          env:
            - name: LOOM_ENV
              value: production
            - name: LOOM_REQUIRE_DURABLE
              value: "true"
            - name: LOOM_DISABLE_DEMO_PRINCIPALS
              value: "true"
            - name: LOOM_WEBHOOK_URL
              value: {{ .Values.loom.webhook.url | quote }}
            - name: LOOM_WEBHOOK_KEY_ID
              value: {{ .Values.loom.webhook.keyId | quote }}
            - name: LOOM_WEBHOOK_ALLOW_HOSTS
              value: {{ .Values.loom.webhook.allowHosts | quote }}
            - name: LOOM_WEBHOOK_TIMEOUT
              value: {{ .Values.loom.webhook.timeout | quote }}
            - name: LOOM_WEBHOOK_DURABLE
              value: "true"
            - name: LOOM_WEBHOOK_OWNER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOOM_WEBHOOK_POLL
              value: {{ .Values.webhookWorker.poll | quote }}
            - name: LOOM_WEBHOOK_LEASE
              value: {{ .Values.webhookWorker.lease | quote }}
            - name: LOOM_WEBHOOK_BACKOFF_BASE
              value: {{ .Values.webhookWorker.backoffBase | quote }}
            - name: LOOM_WEBHOOK_BACKOFF_MAX
              value: {{ .Values.webhookWorker.backoffMax | quote }}
            - name: LOOM_WEBHOOK_MAX_ATTEMPTS
              value: {{ .Values.webhookWorker.maxAttempts | quote }}
            - name: LOOM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.databaseURLKey }}
            - name: LOOM_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.redisURLKey }}
            - name: LOOM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.jwtSecretKey }}
            - name: LOOM_JWT_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.jwtIssuerKey }}
            - name: LOOM_JWT_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.jwtAudienceKey }}
            - name: LOOM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "loom.secretName" . }}
                  key: {{ .Values.secrets.webhookSecretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.webhookWorker.resources | nindent 12 }}
{{- end }}
