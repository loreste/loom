[project]
# Distribution name on PyPI. Import package remains `loom`.
# Never publish as `loom-sdk` — that name is owned by an unrelated project.
name = "loreste-loom"
version = "1.0.1"
description = "Loom Universal Runtime Python SDK (HTTP client)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.urls]
Repository = "https://github.com/loreste/loom"
Homepage = "https://github.com/loreste/loom"
Documentation = "https://github.com/loreste/loom/blob/main/docs/SDK.md"
"Bug Tracker" = "https://github.com/loreste/loom/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["loom*"]
