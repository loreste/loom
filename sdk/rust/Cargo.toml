[package]
name = "loom-sdk"
version = "0.3.0"
edition = "2021"
description = "Loom Universal Runtime Rust SDK (HTTP client)"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
